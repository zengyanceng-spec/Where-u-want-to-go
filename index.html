
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>要去哪裡玩？抽籤器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: "Noto Sans TC", sans-serif;
      background: linear-gradient(135deg, #dff5ff, #c5e8ff);
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(30, 100, 150, 0.15);
      text-align: center;
    }

    h1 {
      color: #1686bd;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 16px;
      border: 2px solid #c9e5f5;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.8;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #299bd2;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #299bd2;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #1686bd;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      margin-top: 24px;
      padding: 24px 12px;
      border-radius: 16px;
      background: #eef9ff;
      min-height: 110px;
    }

    .result-label {
      color: #999;
      font-size: 14px;
      margin-bottom: 10px;
    }

    #resultText {
      font-size: 30px;
      font-weight: bold;
      color: #1686bd;
      overflow-wrap: anywhere;
    }

    .error {
      color: #d93025 !important;
      font-size: 16px !important;
    }

    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>✈️ 要去哪裡玩？</h1>
    <p class="subtitle">旅行目的地選不出來？交給命運決定！</p>

    <textarea id="options" placeholder="每行輸入一個目的地">台北
台中
高雄</textarea>

    <button id="drawButton">🎲 幫我選！</button>

    <section class="result" aria-live="polite">
      <div class="result-label">這次就決定去這裡！</div>
      <div id="resultText">準備出發了嗎？ 🌍</div>
    </section>

    <p class="hint">每個有效目的地都有相同的抽中機會</p>
  </main>

  <script>
    const optionsInput = document.getElementById("options");
    const drawButton = document.getElementById("drawButton");
    const resultText = document.getElementById("resultText");

    drawButton.addEventListener("click", function () {

      // 取得輸入內容並依照換行切割
      const options = optionsInput.value
        .split(/\r?\n/)
        .map(item => item.trim())
        .filter(item => item !== "");

      // 去除完全相同的重複選項
      const uniqueOptions = [...new Set(options)];

      // 檢查清單是否為空
      if (uniqueOptions.length === 0) {
        resultText.textContent = "請先輸入至少一個選項";
        resultText.classList.add("error");
        return;
      }

      // 隨機抽出一個目的地
      const randomIndex = Math.floor(
        Math.random() * uniqueOptions.length
      );

      const selected = uniqueOptions[randomIndex];

      // 顯示抽籤結果
      resultText.textContent = "🎉 " + selected;
      resultText.classList.remove("error");

    });
  </script>

</body>
</html>
